pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def propertiesFile = new File('local.properties')
        if (propertiesFile.exists()) {
            properties.load(new FileInputStream(propertiesFile))
        }
        def flutterSdkPath = properties.getProperty('flutter.sdk')
        if (flutterSdkPath == null) {
            flutterSdkPath = System.getenv("FLUTTER_ROOT")
        }
        return flutterSdkPath
    }()

    if (flutterSdkPath != null) {
        includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    }

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
    }
}

include ":app"

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    flutterRoot = System.getenv('FLUTTER_ROOT')
}

if (flutterRoot != null) {
    apply from: "$flutterRoot/packages/flutter_tools/gradle/app_plugin_loader.gradle"
}
